[project]
name = "technique-extraction"
version = "0.1.0"
description = "AI Technique Extraction Service - Automatically identifies AI techniques from multi-source text content"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bertrend @ git+https://github.com/rte-france/BERTrend.git@v0.1.0",
    "fastapi>=0.104.1",
    "pydantic>=2.5.0",
    "openai>=1.3.7",
    "httpx>=0.25.0",
    "uvicorn[standard]>=0.24.0",
    "python-dateutil>=2.8.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=3.2.0",
    "pytest-json-report>=1.5.0",
    "httpx>=0.25.0",
    "openai>=1.3.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "pipeline: Core extraction pipeline tests",
    "error_handling: Error handling and resilience tests",
    "monitoring: Health check and logging tests",
    "taxonomy: Taxonomy and confidence scoring tests",
    "slow: Tests that take significant time to execute",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

