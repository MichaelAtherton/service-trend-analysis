    GapTrend:
      type: object
      required:
        - id
        - technique_a
        - technique_b
        - severity
        - type
        - metrics
        - recommendation
      properties:
        id:
          type: string
        technique_a:
          type: string
          example: "RAG"
        technique_b:
          type: string
          example: "streaming"
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
        type:
          type: string
          enum: [GAP]
        metrics:
          type: object
          required:
            - papers_a
            - papers_b
            - combined
          properties:
            papers_a:
              type: integer
              description: Papers mentioning technique A
              example: 45
            papers_b:
              type: integer
              description: Papers mentioning technique B
              example: 23
            combined:
              type: integer
              description: Papers mentioning both (should be 0 for gaps)
              example: 0
        recommendation:
          type: string
          example: "Research opportunity - high-value unexplored combination"
        constitution_match:
          type: object
          properties:
            matched_focus_areas:
              type: array
              items:
                type: string
            boost_applied:
              type: boolean

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - timestamp
            - request_id
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "INVALID_CORPUS"
            message:
              type: string
              description: Human-readable error message
              example: "Corpus validation failed"
            details:
              oneOf:
                - type: object
                - type: array
                - type: string
              description: Additional error context
            timestamp:
              type: string
              format: date-time
              example: "2025-10-30T14:32:18Z"
            request_id:
              type: string
              description: Unique request identifier for support
              example: "req_abc123"
            support_email:
              type: string
              format: email
              description: Contact for support (included in 500 errors)
